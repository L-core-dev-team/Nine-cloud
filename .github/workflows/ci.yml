name: jiuxiao-workspace
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 11025:1025
          - 18025:8025
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jiuxiao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jiuxiao_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # The browser regression compares the protected AI editor to its frozen baseline commit.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
      - name: Migrate ephemeral test database
        run: |
          pnpm --filter @jiuxiao/db db:migrate
          pnpm --filter @jiuxiao/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - run: pnpm license:check
      - name: Test the dependency licence policy
        run: pnpm exec vitest run scripts/audit/license-check.test.mjs
      - name: Test GitHub evidence synchronization gate
        run: node --test scripts/build/ci-evidence.test.mjs
      - name: Test fail-closed media publication gate
        run: node scripts/audit/media-release-check.test.mjs
      - name: Validate the production Caddyfile
        # SEC-06: the reverse-proxy config is part of the production topology, so
        # it belongs under review like any other code. A Caddyfile syntax error
        # makes Caddy exit 1 on startup and restart-loop; ACME never runs, no
        # certificate is issued, and the log shows nothing but
        # "Using config from file" — so an unreviewed mistake here keeps the API
        # dark while looking like it is merely waiting on DNS. Validate it on
        # every build with the same image tag the server runs.
        run: |
          docker run --rm \
            --volume "$PWD/deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Scan web artifacts for scene packages
        # Defense in depth: the workspace build excludes the unapproved scene
        # experiment packages via pnpm negative filters alone. This post-build
        # scan fails closed if scene-studio/scene-gate paths or three.js code
        # ever reach apps/web/dist; mountain-gate candidate media is exempt at
        # the filename level only.
        run: pnpm scan:artifacts
      - name: Prove the release-target build passes with verified media licenses
        # SEC-05: this step proves the media gate is actually wired into release
        # builds. The manifest was verified and author-approved on 2026-10-10
        # (BIRD-04 / G-05 closure; see docs/acceptance/2026-10-10/), so the
        # release build must now succeed AND the standalone gate check must
        # report the full evidence chain passing.
        run: |
          pnpm --filter @jiuxiao/web build
          node scripts/audit/media-release-check.mjs | grep -q "Media release evidence structure"
        env:
          JIUXIAO_BUILD_TARGET: release
      - name: Scan web artifacts for scene packages
        # Rescans whatever the release-target build attempt left in
        # apps/web/dist; once the media manifest is verified and the
        # release-target build is flipped to require success, this scan
        # guards the actual release build output.
        run: pnpm scan:artifacts
      - name: Build and smoke the production API container
        run: |
          docker build --tag "jiuxiao-api-review:$REVIEW_SHA" --file apps/api/Dockerfile .
          TEST_API_IMAGE="jiuxiao-api-review:$REVIEW_SHA" node tests/integration/api-image-smoke.mjs
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - name: Test durable turn UI recovery with synthetic receipts
        run: node tests/e2e/turns.cjs
      - name: Test isolated SMTP and cloud browser path
        run: node tests/e2e/cloud.cjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
          TEST_SMTP_URL: smtp://127.0.0.1:11025
          MAILPIT_API_URL: http://127.0.0.1:18025
      - name: Verify isolated database backup restoration
        run: node tests/integration/database-restore.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - name: Bind review artifacts to the tested commit
        run: node scripts/build/write-review-bundle.mjs
      - name: Generate exact-build G1 and Canon review packets
        run: node scripts/build/write-closeout-packets.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload engineering review artifacts and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jiuxiao-engineering-review-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/api/dist/
            packages/db/dist/
            packages/contracts/dist/
            packages/domain/dist/
            packages/content/dist/
            test-results/review-bundle/
            test-results/cloud/
            test-results/turns/
