name: jiuxiao-workspace
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jiuxiao_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jiuxiao_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org
      - name: Migrate ephemeral test database
        run: pnpm --filter @jiuxiao/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - run: pnpm license:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Run PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jiuxiao_test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
