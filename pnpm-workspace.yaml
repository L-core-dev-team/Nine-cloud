# The Three.js mountain-gate pilot (`apps/scene-studio` + `packages/scene-gate`)
# stays in the workspace so it can still be built and verified on demand with its
# explicit `--filter @jiuxiao/scene-*` commands, but it is excluded from every
# recursive production command (`pnpm -r build` / `-r typecheck` / `-r test`) via
# the `!@jiuxiao/scene-*` filter in the root scripts. See package.json and
# `apps/scene-studio/README.md`.
packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  workerd: false

minimumReleaseAgeExclude:
  - nodemailer@10.0.13

overrides:
  esbuild: 0.28.2
  # GHSA-wq5f-xc86-pv6w / CVE-2026-96889: sharp < 0.35.5 bundles a vulnerable
  # librsvg. The package arrives only through the devDependency chain
  # wrangler -> miniflare, which pins `sharp: 0.35.4` exactly and has not been
  # updated upstream, so an override is the only way to clear the alert. This is
  # a same-minor patch bump; the image build never ships sharp.
  sharp: 0.35.5
