services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jiuxiao
      POSTGRES_USER: jiuxiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jiuxiao_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiuxiao -d jiuxiao"]
      interval: 5s
      timeout: 3s
      retries: 12

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 8787
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://jiuxiao:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/jiuxiao
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

volumes:
  jiuxiao_pg:
