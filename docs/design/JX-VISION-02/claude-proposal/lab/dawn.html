<style>

<body><div id="stage"><canvas id="c"></canvas><div class="ui" id="ui"></div></div>
<script type="module">
import { rng, makeNoise } from './js/paint.js';
import { sunFromGameMinute, skyRadiance, tonemap } from './js/sky.js';
const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'desktop';
const stage = q.get('stage') || 'result';      // result | flight | clarify | study | night
const minute = +(q.get('minute') || ({ result: 330, flight: 330, clarify: 330, study: 345, night: 1035 })[stage]);
const bare = q.get('bare') === '1';
const kbd = q.get('kbd') === '1';
if (mode === 'phone') document.body.classList.add('phone');
const W = mode === 'phone' ? 390 : 1600, H = mode === 'phone' ? 844 : 900, DPR = 2;
const cv = document.getElementById('c'); cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
document.getElementById('stage').style.width = W + 'px'; document.getElementById('stage').style.height = H + 'px';
const ctx = cv.getContext('2d');

// ---------- world plate (the location's fixed optics) ----------
// world units: 2000 x 1000, horizon at y = HZ. Camera on 望气台, looking roughly east over the river mouth.
const HZ = 430, FOVH = 46 * Math.PI / 180, F = 1000 / Math.tan(FOVH / 2);
const CAM_AZ = (+(q.get('az')||74)) * Math.PI / 180;
// view: which part of the plate the viewport shows (scene spec decides this from anchors)
const ANCH = { rock: [1330, 0], crows: [1330, 0], boat: [1262, 0], ferry: [1180, 0] };
let view;
const PANEL = mode === 'phone' ? (kbd ? 210 : 470) : H; // phone: plate occupies the top part
if (mode === 'phone') {
  const s = PANEL / (kbd ? 420 : 760);
  const cx = 1290, top = kbd ? 390 : 70;
  view = { s, ox: cx - W / 2 / s, oy: top };
} else if ((q.get('shot') || ({ result: 'close', study: 'close' })[stage] || 'wide') === 'close') { const s = 1.7; view = { s, ox: 1330 - 980 / s, oy: 430 - 175 / s }; } else view = { s: 0.8, ox: 0, oy: 0 };
const toS = (x, y) => [(x - view.ox) * view.s, (y - view.oy) * view.s];
const toW = (sx, sy) => [sx / view.s + view.ox, sy / view.s + view.oy];

const N = makeNoise(7), R = rng(11);
const farBank = (x) => HZ + 6 + 30 * Math.pow(1 - x / 2000, 2) + N.fbm1(x * 0.004) * 5;
const nearBank = (x) => 575 + 80 * (x / 2000) + (N.fbm1(x * 0.003 + 9) - 0.5) * 26;
for (const k in ANCH) ANCH[k][1] = nearBank(ANCH[k][0]);
ANCH.rock[1] -= 7; ANCH.crows[1] -= 20; ANCH.boat[0] = 1236; ANCH.boat[1] = nearBank(1236) + 92; ANCH.ferry[0] = 1120; ANCH.ferry[1] = nearBank(1120) + 50;

// ---------- light from the authoritative game minute ----------
const sun = sunFromGameMinute(minute);
const se = sun.elevation, sa = sun.azimuth;
const sunDir = [Math.cos(se) * Math.sin(sa), Math.sin(se), Math.cos(se) * Math.cos(sa)];
const dirOf = (wx, wy) => { const yaw = CAM_AZ + Math.atan2(wx - 1000, F); const p = Math.atan2(HZ - wy, Math.hypot(wx - 1000, F)); return [Math.cos(p) * Math.sin(yaw), Math.sin(p), Math.cos(p) * Math.cos(yaw)]; };
const NIGHT = [0.00035, 0.0005, 0.0011];
const sky = (d) => { const c = skyRadiance(d, sunDir, 10, 5); return c.map((v, i) => v + NIGHT[i]); };
const lum = (c) => 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
const refSky = sky(dirOf(1000, HZ - 300));
const exposure = Math.min(900, (+(q.get('k')||0.03)) / Math.pow(Math.max(lum(refSky), 1e-5), 0.92));
const transmit = (() => { if (se < -0.02) return [0, 0, 0]; const m = 1 / (Math.sin(Math.max(se, 0.004)) + 0.15 * Math.pow(Math.max(se * 57.3, 0) + 3.885, -1.253)); return [5.8e-6, 13.5e-6, 33.1e-6].map((b) => Math.exp(-(b * 8000 + 21e-6 * 1.1 * 1200) * m)); })();
const SUN_E = 22;
const ambient = sky([0, 1, 0]).map((v) => v * 2.2);
const sunScreen = (() => { const rel = ((sa - CAM_AZ + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; return { wx: 1000 + F * Math.tan(rel), wy: HZ - F * Math.tan(se) / Math.cos(rel), front: Math.cos(rel) > 0, rel }; })();

// horizon colour per column (for aerial perspective)
const HC = []; for (let wx = -200; wx <= 2200; wx += 50) HC.push(sky(dirOf(wx, HZ - 4)));
const hcol = (wx) => { const t = Math.min(HC.length - 1.001, Math.max(0, (wx + 200) / 50)); const i = Math.floor(t), f = t - i; return HC[i].map((v, k) => v * (1 - f) + HC[i + 1][k] * f); };
// grade (a colourist's choice, separate from the physics): cool shadows, warm highlights — the per-location 'look'
const GRADE = { lo: [0.78, 0.92, 1.32], hi: [1.04, 1.0, 0.93] };
const tm = (c) => { const l = Math.min(1, lum(c) * exposure * 1.6); const t = l * l * (3 - 2 * l); return tonemap(c.map((v, k) => v * (GRADE.lo[k] * (1 - t) + GRADE.hi[k] * t)), exposure); };
const rgb = (c, a = 1) => { const t = tm(c); return `rgba(${t[0]},${t[1]},${t[2]},${a})`; };
// lit surface radiance: albedo under sky ambient + sun with a facing factor, then aerial perspective by distance (m)
function shade(albedo, facing, dist, wx) {
  const L = albedo.map((a, k) => a * (ambient[k] * 0.32 + SUN_E * transmit[k] * Math.max(0, facing) / Math.PI));
  const T = Math.exp(-dist / 5200), h = hcol(wx);
  return L.map((v, k) => v * T + h[k] * (1 - T));
}

// ---------- paint the sky (per-pixel from a coarse grid) ----------
function paintSkyAndWater() {
  const g = mode === 'phone' ? 4 : 6; const Wd = W * DPR, Hd = H * DPR;
  const gw = Math.ceil(W / g) + 2, ghMax = Math.ceil(H / g) + 2;
  const grid = new Float32Array(gw * ghMax * 3);
  for (let j = 0; j < ghMax; j++) for (let i = 0; i < gw; i++) {
    const [wx, wy] = toW(i * g, j * g);
    const my = wy < HZ ? wy : HZ - (wy - HZ);  // water: mirrored direction
    grid.set(sky(dirOf(wx, Math.min(my, HZ - 0.3))), (j * gw + i) * 3);
  }
  const img = ctx.createImageData(Wd, Hd), D = img.data;
  const sunPx = toS(sunScreen.wx, sunScreen.wy);
  const sunR = 0.27 * Math.PI / 180 * F * view.s;
  for (let py = 0; py < Hd; py++) {
    const sy = py / DPR, gy = sy / g, j0 = Math.floor(gy), ty = gy - j0;
    const wy = toW(0, sy)[1];
    if (mode === 'phone' && sy > PANEL) break;
    for (let px = 0; px < Wd; px++) {
      const sx = px / DPR, gx = sx / g, i0 = Math.floor(gx), tx = gx - i0;
      const o = (py * Wd + px) * 4; let c = [0, 0, 0];
      for (let k = 0; k < 3; k++) { const a = grid[(j0 * gw + i0) * 3 + k], b = grid[(j0 * gw + i0 + 1) * 3 + k], cc = grid[((j0 + 1) * gw + i0) * 3 + k], dd = grid[((j0 + 1) * gw + i0 + 1) * 3 + k]; c[k] = (a * (1 - tx) + b * tx) * (1 - ty) + (cc * (1 - tx) + dd * tx) * ty; }
      const wx = toW(sx, 0)[0];
      if (wy >= HZ) {
        // water: Fresnel-weighted sky reflection over silty body colour (渡槽淤了半尺，水发黄)
        const pitch = Math.atan2(wy - HZ, Math.hypot(wx - 1000, F));
        const fr = 0.02 + 0.98 * Math.pow(1 - Math.sin(pitch), 5);
        const body = shade([0.09, 0.075, 0.045], sunDir[1], 900, wx);
        // ripples: streaks in world space
        const rip = 0.75 + 0.5 * N.n2(wx * 0.004, (wy - HZ) * 0.22 + N.n1(wx * 0.002) * 3);
        c = c.map((v, k) => (v * fr * rip + body[k] * (1 - fr)));
        // sun glitter: facet-slope probability (gentle ripples, sigma ~ 0.09 rad)
        if (sunScreen.front && se > -0.01) {
          const yaw = Math.atan2(wx - 1000, F) - sunScreen.rel; const tilt2 = (yaw * yaw + (pitch - se) * (pitch - se)) / 4;
          const p = Math.exp(-tilt2 / (2 * 0.09 * 0.09)) * (0.35 + 1.6 * Math.pow(Math.max(0, N.n2(wx * 0.06, (wy - HZ) * 0.9)), 6));
          c = c.map((v, k) => v + p * SUN_E * transmit[k] * 0.006);
        }
      } else if (sunScreen.front) {
        const dd = Math.hypot(sx - sunPx[0], sy - sunPx[1]);
        if (dd < sunR) c = c.map((v, k) => v + SUN_E * transmit[k] * 0.9);
        else c = c.map((v, k) => v + SUN_E * transmit[k] * (0.22 * Math.pow(sunR / dd, 2) + 0.012 * Math.exp(-dd / (sunR * 9))));
      }
      // blue-noise-ish dither against banding
      const t = tm(c), n = (R() - 0.5) * 2.2;
      D[o] = t[0] + n; D[o + 1] = t[1] + n; D[o + 2] = t[2] + n; D[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
}
paintSkyAndWater();
ctx.setTransform(DPR * view.s, 0, 0, DPR * view.s, -view.ox * view.s * DPR, -view.oy * view.s * DPR);
if (mode === 'phone') { ctx.save(); ctx.beginPath(); ctx.rect(view.ox, view.oy, W / view.s, PANEL / view.s); ctx.clip(); }

// ---------- land layers ----------
function band(top, bottom, x0, x1, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x0, top(x0)); for (let x = x0; x <= x1; x += 6) ctx.lineTo(x, top(x)); for (let x = x1; x >= x0; x -= 6) ctx.lineTo(x, bottom(x)); ctx.closePath(); ctx.fill(); }
function gradBand(top, bottom, x0, x1, albedo, facing, dist) { const g = ctx.createLinearGradient(x0, 0, x1, 0); for (let i = 0; i <= 8; i++) { const x = x0 + (x1 - x0) * i / 8; g.addColorStop(i / 8, rgb(shade(albedo, facing, dist, x))); } band(top, bottom, x0, x1, g); }
// far ridge, very far
const ridge = (x) => HZ - 6 - 26 * N.ridge1(x * 0.0016 + 3) - 10 * N.fbm1(x * 0.01);
gradBand(ridge, () => HZ + 0.5, -10, 2010, [0.06, 0.07, 0.08], 0.3, 14000);
// far bank: flat reed land between horizon and the river
gradBand(() => HZ, farBank, -10, 2010, [0.10, 0.09, 0.06], sunDir[1], 3600);
// near bank: slopes up toward the platform
const nearTop = (x) => nearBank(x);
gradBand(nearTop, () => 1010, -10, 2010, [0.085, 0.075, 0.05], sunDir[1] * 0.9, 1300);
// the ferry channel (渡槽): a straight water slot cut into the near bank, leading to the berth
const chan = [[1304, nearBank(1304)+2], [1352, nearBank(1352)+2], [1262, nearBank(1236) + 104], [1214, nearBank(1236) + 98]];
ctx.fillStyle = rgb(shade([0.05, 0.045, 0.03], sunDir[1], 1300, 1290).map((v, k) => v + hcol(1290)[k] * 0.05)); ctx.beginPath(); chan.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill();
// silt pools on the near bank: small mirrors of the sky at their own depression angle
{ const pr = rng(31); for (let i = 0; i < 16; i++) { const x = 80 + pr() * 1800, y = nearBank(x) + 60 + pr() * 230, w = 18 + pr() * 60, h = 1 + pr() * 2;
  const refl = sky(dirOf(x, HZ - (y - HZ))); const fr = 0.02 + 0.98 * Math.pow(1 - Math.sin(Math.atan2(y - HZ, F)), 5);
  ctx.fillStyle = rgb(refl.map((v) => v * (fr + 0.1)), 0.55); ctx.beginPath(); ctx.ellipse(x, y, w, h, 0, 0, 7); ctx.fill(); } }
// reed beds along both banks: thousands of stems; plumes catch the light (forward scattering when the sun is ahead)
const reedLit = Math.max(0, sunScreen.front ? Math.cos(sunScreen.rel) : 0.25) * Math.max(0, Math.min(1, se * 8 + 0.2));
function reeds(yOf, x0, x1, count, hgt, dist, seed) {
  const r = rng(seed); const base = shade([0.12, 0.1, 0.06], sunDir[1], dist, (x0 + x1) / 2);
  const plume = shade([0.55, 0.5, 0.42], 0.5 + reedLit, dist, (x0 + x1) / 2).map((v, k) => v + SUN_E * transmit[k] * reedLit * 0.03);
  for (let i = 0; i < count; i++) {
    let x = x0 + r() * (x1 - x0); if (N.n1(x * 0.012 + seed) < 0.42 && r() < 0.8) continue; const y = yOf(x) + r() * 10, h = hgt * (0.45 + r() * 0.5 + N.n1(x * 0.02 + seed * 3) * 0.6), lean = (N.n1(x * 0.01) - 0.5) * 0.5 + 0.18;
    ctx.strokeStyle = rgb(base, 0.85); ctx.lineWidth = 0.9; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + lean * h * 0.3, y - h * 0.6, x + lean * h, y - h); ctx.stroke();
    ctx.fillStyle = rgb(plume, 0.8); ctx.beginPath(); ctx.ellipse(x + lean * h, y - h, 1.5, h * 0.13, lean, 0, 7); ctx.fill();
  }
}
reeds(farBank, -10, 2010, 900, 7, 3600, 3);
reeds((x) => nearBank(x) + 8, -10, 2010, 2400, 26, 1000, 4);
// settlement 芦花渡: a few low roofs behind the berth
for (const [x, w, h] of [[1080, 80, 28], [1150, 60, 23], [1200, 66, 26], [1030, 50, 20], [1440, 60, 22]]) {
  const y = nearBank(x) + 62; ctx.fillStyle = rgb(shade([0.05, 0.045, 0.04], 0.2, 1300, x)); ctx.beginPath(); ctx.moveTo(x - w / 2 - 4, y - h * 0.45); ctx.lineTo(x, y - h); ctx.lineTo(x + w / 2 + 4, y - h * 0.45); ctx.lineTo(x + w / 2, y); ctx.lineTo(x - w / 2, y); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgb(shade([0.3, 0.27, 0.22], 0.8, 1300, x).map((v, k) => v + SUN_E * transmit[k] * 0.004), 0.8); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - w / 2 - 4, y - h * 0.45); ctx.lineTo(x, y - h); ctx.lineTo(x + w / 2 + 4, y - h * 0.45); ctx.stroke();
}
// berth and the stuck boat (船吃水太深，蹭着淤泥靠不上岸)
const [bx, by] = ANCH.boat; ctx.fillStyle = rgb(shade([0.06, 0.05, 0.04], 0.2, 1300, bx));
ctx.fillRect(1190, by + 10, 36, 3.5); for (let i = 0; i < 5; i++) ctx.fillRect(1191 + i * 8, by + 10, 2.2, 10);
ctx.save(); ctx.translate(bx, by); ctx.rotate(-0.12); ctx.scale(1.9,1.9); ctx.beginPath(); ctx.moveTo(-17, 0); ctx.quadraticCurveTo(0, 6, 17, -2); ctx.lineTo(14, 2); ctx.quadraticCurveTo(0, 7, -14, 3); ctx.closePath(); ctx.fill(); ctx.restore();
// the rockslide at the channel mouth: stones from upstream, the largest as tall as a door
const night = se < -0.06;
const [rx, ry] = ANCH.rock; const rr = rng(21);
const stoneCol = shade([0.11, 0.1, 0.09], sunDir[1] * 0.7 + 0.2, 1300, rx), stoneLit = shade([0.2, 0.18, 0.15], 0.9, 1300, rx).map((v, k) => v + SUN_E * transmit[k] * 0.006 * (sunScreen.front ? 1 : 0.4));
const stones = []; for (let i = 0; i < 34; i++) stones.push([rx - 52 + rr() * 104, ry + 6 - rr() * 18 * (1 - Math.abs(rr() - 0.5)), 4 + rr() * 9]);
stones.push([rx + 6, ry - 12, 16]);
stones.sort((a, b) => a[1] - b[1]);
const sideS = Math.sign(sunScreen.wx - rx) || 1;
for (const [x, y, r0] of stones) {
  const n = 7, pts = []; for (let i = 0; i < n; i++) { const a = Math.PI * (1 + i / (n - 1)); const rad = r0 * (0.75 + rr() * 0.4); pts.push([x + Math.cos(a) * rad * 1.3, y + Math.sin(a) * rad * (i === 0 || i === n - 1 ? 0.2 : 1)]); }
  ctx.fillStyle = rgb(stoneCol); ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.lineTo(x + r0 * 1.2, y + r0 * 0.25); ctx.lineTo(x - r0 * 1.2, y + r0 * 0.25); ctx.closePath(); ctx.fill();
