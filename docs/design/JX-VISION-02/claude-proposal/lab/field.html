<html lang="zh-CN"><head><meta charset="utf-8"><title>灵台 · 概念帧</title>

<body><canvas id="c"></canvas>
<script type="module">

const q = new URLSearchParams(location.search);
const mode = q.get('mode') || 'desktop', phase = q.get('phase') || 'body';

const s = mode === 'phone' ? 0.5 : 1;
const C = mode === 'phone' ? [W * 0.5, H * 0.42] : [W * 0.46, H * 0.46];      // 灵台: the player's core

for (const [r, a] of [[60, 0.08], [18, 0.3], [5, 0.8]]) { const g = ctx.createRadialGradient(NPC[0], NPC[1], 0, NPC[0], NPC[1], r * s); g.addColorStop(0, `rgba(190,220,210,${a})`); g.addColorStop(1, 'rgba(190,220,210,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(NPC[0], NPC[1], r * s, 0, 7); ctx.fill(); }
