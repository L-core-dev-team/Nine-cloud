<!doctype html><meta charset="utf-8"><title>九霄多 AI 调度验收 · DEV ONLY</title><style>body{background:#122030;color:#eee;font:15px/1.8 monospace;padding:24px}iframe{display:none}pre{white-space:pre-wrap}</style><h1>多 AI 调度与故障测试</h1><p>独立内存对象与模拟网络响应，不调用真实 API、不写入玩家存档。</p><pre id="result">测试中…</pre><iframe id="app" src="九霄WEB-1.0.html"></iframe>
<script>
document.getElementById('app').onload=async()=>{
 const j=document.getElementById('app').contentWindow.JX,a=j.AI,out=[];
 const assert=x=>{if(!x)throw Error('assertion')},test=async(name,f)=>{try{await f();out.push('PASS '+name)}catch(e){out.push('FAIL '+name+'：'+e.message)}document.getElementById('result').textContent=out.join('\n')},reject=async f=>{let caught=false;try{await f()}catch{caught=true}assert(caught)};
 const config=()=>{const c=a.defaults();c.mode='multi';for(const p of Object.values(c.roles)){p.enabled=true;p.baseUrl='https://example.invalid/v1';p.model='DEV-ONLY';}return c};
 const save=()=>{const s=j.blank('DEV ONLY');s.pending={id:'turn-test',text:'观察山道',gm:false};return s};
 const narrative={story:'测试正文：沿山道走到驿站。',actions:['观察','休息','交谈']};
 const state=()=>({player:{},npcs:[],items:null,world:{location:'驿站',intel:[]},elapsedMinutes:5,summary:'到达驿站',longSummary:null,facts:[],worldEvents:[],foreshadowing:[]});
 const plan={plot_beats:[],npc_intentions:{},forbidden_events:[],foreshadowing:[],continuity_requirements:[]};
 const fake=(calls,fail=[])=>async(role,messages,c,signal,meta)=>{calls.push({role,stage:meta.stage});if(fail.includes(role)||fail.includes(meta.stage))throw Error('DEV failure');return JSON.stringify(meta.stage==='正文'?narrative:['director','premiumDirector'].includes(role)?plan:state())};
 await test('Base URL与完整地址兼容',()=>{assert(a.endpoint('https://example.invalid/v1/')==='https://example.invalid/v1/chat/completions');assert(a.endpoint('https://example.invalid/custom/chat/completions')==='https://example.invalid/custom/chat/completions')});
 await test('拒绝URL携带密钥与非HTTP协议',async()=>{await reject(()=>a.endpoint('https://example.invalid/v1?key=secret'));await reject(()=>a.endpoint('file:///x'))});
 await test('普通回合仅调用剧情和状态岗位',async()=>{const s=save(),calls=[];let draft=null;const r=await a.run(s,config(),null,async d=>draft=d,fake(calls));assert(calls.map(x=>x.role).join(',')==='story,stateManager'&&draft.story===narrative.story&&r.result.story===narrative.story&&s.turn===0)});
 await test('重要剧情导演失败回退主剧情',async()=>{const s=save();s.pending.text='宗门冲突';const calls=[];const r=await a.run(s,config(),null,async()=>{},fake(calls,['director']));assert(calls.map(x=>x.role).join(',')==='director,story,stateManager'&&r.result&&r.warnings.length)});
 await test('高级导演失败后普通导演接管',async()=>{const s=save();s.pending.text='宗门战争';const calls=[];const r=await a.run(s,config(),null,async()=>{},fake(calls,['premiumDirector']));assert(calls.map(x=>x.role).join(',')==='premiumDirector,director,story,stateManager'&&r.routing.score===5)});
 await test('状态模型失败由主模型提取状态',async()=>{const calls=[];const r=await a.run(save(),config(),null,async()=>{},fake(calls,['stateManager']));assert(calls.map(x=>x.role).join(',')==='story,stateManager,story'&&r.result.summary==='到达驿站')});
 await test('双重状态失败保留正文且不推进世界',async()=>{const s=save(),calls=[];let draft;const r=await a.run(s,config(),null,async d=>draft=d,fake(calls,['状态结算']));assert(r.unsettled&&draft.story===narrative.story&&s.turn===0&&s.items.length===0)});
 await test('重试未结算正文不重新生成剧情',async()=>{const s=save();s.pending.draftNarrative=narrative;const calls=[];const r=await a.run(s,config(),null,async()=>{},fake(calls));assert(calls.length===1&&calls[0].role==='stateManager'&&r.result.story===narrative.story)});
 await test('单AI模式一次返回完整回合且存档通用',async()=>{const c=config();c.mode='single';const s=save();let count=0;const r=await a.run(s,c,null,async()=>{},async()=>{count++;return JSON.stringify({...state(),...narrative})});const next=a.applyExtensions(j.apply(s,r.result),r.result,r);const loaded=j.importData(JSON.stringify({format:'JIUXIAO_SAVE',version:1,save:next}));assert(count===1&&loaded.turn===1&&!JSON.stringify(loaded).includes('apiKey'))});
 await test('模式切换后仍可恢复未结算正文',async()=>{const c=config();c.mode='single';const s=save();s.pending.draftNarrative=narrative;const calls=[];const r=await a.run(s,c,null,async()=>{},fake(calls));assert(calls.length===1&&calls[0].role==='story'&&r.result)});
 await test('主模型失败不会创建正文或状态',async()=>{let draft=false;await reject(()=>a.run(save(),config(),null,async()=>draft=true,async()=>{throw Error('offline')}));assert(!draft)});
 await test('取消不会触发辅助模型回退',async()=>{const ac=new AbortController(),calls=[];await reject(()=>a.run(save(),config(),ac.signal,async()=>{},async(role)=>{calls.push(role);ac.abort();throw Error('cancel')}));assert(calls.length===1)});
 await test('拒绝非法字段同时保留正文与合法地点',()=>{const d=state();d.items=[{id:'bad',name:'坏数量',quantity:-1}];d.elapsedMinutes=-2;const r=a.sanitizeState(d,save(),narrative);assert(r.result.items===null&&r.result.elapsedMinutes===0&&r.result.world.location==='驿站'&&r.warnings.length===2)});
 await test('越界关系和未经授权复活不写入',()=>{const s=save();s.player.生命状态='死亡';const d=state();d.player={生命状态:'存活',信任:200};const r=a.sanitizeState(d,s,narrative);assert(r.result.player.生命状态===undefined&&r.result.player.信任===undefined&&r.warnings.length===2)});
 await test('世界事件去重，伏笔更新可兼容导入',()=>{const s=save(),d=state();d.worldEvents=[{id:'e',content:'山道封闭',location:'山道',relatedCharacters:[]}];d.foreshadowing=[{id:'f',content:'石碑秘密',relatedCharacters:[],status:'active',importance:80}];const r=a.sanitizeState(d,s,narrative);let next=a.applyExtensions(j.apply(s,r.result),r.result,{routing:{score:1},warnings:[]});next=a.applyExtensions(next,r.result,{routing:{score:1},warnings:[]});assert(next.worldEvents.length===1&&next.foreshadowing.length===1);j.importData(JSON.stringify({format:'JIUXIAO_SAVE',version:1,save:next}))});
 await test('档案只在周期调用，建议不删除记忆',async()=>{const s=save(),c=config();let count=0;assert(await a.archive(s,c,null,async()=>{count++})===null);s.turn=25;const original=JSON.stringify(s);const r=await a.archive(s,c,null,async()=>{count++;return JSON.stringify({contradictions:[],duplicate_memories:[],stale_memories:[],unresolved_foreshadowing:[],absent_characters:[],future_suggestions:['保留旧局差异']})});assert(count===1&&r.status==='reviewed'&&JSON.stringify(s)===original)});
 await test('档案失败不抛错也不更改已结算回合',async()=>{const s=save();s.turn=25;const r=await a.archive(s,config(),null,async()=>{throw Error('offline')});assert(r.status==='failed'&&s.turn===25)});
 await test('调用器读取真实usage并隐藏认证头',async()=>{const c=config();c.roles.story.apiKey='DEV-FAKE-KEY';const t=await a.call('story',[{role:'user',content:'test'}],c,null,{},async(url,options)=>{assert(options.headers.Authorization==='Bearer DEV-FAKE-KEY'&&url.endsWith('/chat/completions'));return {ok:true,json:async()=>({choices:[{message:{content:'ok'}}],usage:{prompt_tokens:12,completion_tokens:3}})}});const l=a.logs.at(-1);assert(t==='ok'&&l.inputTokens===12&&l.outputTokens===3&&!JSON.stringify(l).includes('DEV-FAKE-KEY'))});
 await test('HTTP错误可区分且服务端回显密钥脱敏',async()=>{const c=config();c.roles.story.apiKey='DEV-FAKE-KEY';await reject(()=>a.call('story',[],c,null,{},async()=>({ok:false,status:401,json:async()=>({error:{message:'invalid DEV-FAKE-KEY'}})})));const l=a.logs.at(-1);assert(l.error.includes('401')&&!JSON.stringify(l).includes('DEV-FAKE-KEY'))});
 await test('缺少usage不伪造零tokens',async()=>{await a.call('story',[],config(),null,{},async()=>({ok:true,json:async()=>({choices:[{message:{content:'ok'}}]})}));assert(a.logs.at(-1).inputTokens===null)});
 await test('被截断响应拒绝提交',async()=>{await reject(()=>a.call('story',[],config(),null,{},async()=>({ok:true,json:async()=>({choices:[{finish_reason:'length',message:{content:'partial'}}]})})));assert(!a.logs.at(-1).success)});
 await test('非法状态JSON触发备用结算',async()=>{const calls=[];const r=await a.run(save(),config(),null,async()=>{},async(role,m,c,signal,meta)=>{calls.push(role);if(role==='stateManager')return 'bad json';return JSON.stringify(meta.stage==='正文'?narrative:state())});assert(calls.join(',')==='story,stateManager,story'&&r.result)});
 await test('导演方案格式异常时不阻止正文',async()=>{const s=save();s.pending.text='Boss战';const r=await a.run(s,config(),null,async()=>{},async(role,m,c,signal,meta)=>JSON.stringify(role==='director'?{bad:true}:meta.stage==='正文'?narrative:state()));assert(r.result&&r.warnings.length)});
 await test('未结算正文及待行动可导出再导入',()=>{const s=save();s.pending.draftNarrative=narrative;s.pending.failure='测试失败';const copy=j.importData(JSON.stringify({format:'JIUXIAO_SAVE',version:1,save:s}));assert(copy.pending.draftNarrative.story===narrative.story&&copy.turn===0)});
 await test('每岗位使用独立提示词',()=>{assert(a.prompts.storyPrompt!==a.prompts.stateManagerPrompt&&!a.prompts.directorPrompt.includes('summary必填')&&a.prompts.archivePrompt.includes('只给建议'))});
 await test('无AI配置不可发出调用',async()=>{let count=0;await reject(()=>a.call('story',[],a.defaults(),null,{},async()=>{count++}));assert(count===0)});
 await test('提供商超时有明确错误并停止请求',async()=>{const c=config();c.roles.story.timeout=0.01;await reject(()=>a.call('story',[],c,null,{},async(url,options)=>new Promise((resolve,reject)=>options.signal.addEventListener('abort',()=>reject(Error('aborted')),{once:true}))));assert(a.logs.at(-1).error.startsWith('Timeout'))});
 await test('未知上下文用量不会变成价格或估算费用',()=>{assert(!('price' in a.totals)&&a.totals.unknownUsage>0)});
 await test('未知人物引用只拒绝对应条目',()=>{const d=state();d.worldEvents=[{id:'bad-ref',content:'事件',location:'驿站',relatedCharacters:['missing']},{id:'good-ref',content:'主角入城',location:'驿站',relatedCharacters:['player']}];const r=a.sanitizeState(d,save(),narrative);assert(r.result.worldEvents.length===1&&r.result.worldEvents[0].id==='good-ref'&&r.warnings.length===1)});
 await test('允许事件引用本轮合法新增NPC',()=>{const d=state();d.npcs=[{id:'new-npc',name:'测试人物',visibility:'PLAYER_KNOWN'}];d.foreshadowing=[{id:'new-hook',content:'测试约定',status:'active',importance:50,relatedCharacters:['new-npc']}];const r=a.sanitizeState(d,save(),narrative);assert(r.result.foreshadowing.length===1&&r.warnings.length===0)});
 await test('已拒绝的NPC不能被伏笔引用',()=>{const d=state();d.npcs=[{id:'bad',name:'',visibility:'PLAYER_KNOWN'}];d.foreshadowing=[{id:'bad-hook',content:'未知约定',status:'active',importance:50,relatedCharacters:['bad']}];const r=a.sanitizeState(d,save(),narrative);assert(r.result.npcs.length===0&&r.result.foreshadowing.length===0)});
 await test('旧世界事件不能通过同ID被改写',()=>{const s=save();s.worldEvents=[{id:'e',content:'抵达驿站',location:'驿站',relatedCharacters:['player']}];const d=state();d.worldEvents=[{id:'e',content:'毁灭驿站',location:'驿站',relatedCharacters:['player']}];const r=a.sanitizeState(d,s,narrative);assert(r.result.worldEvents.length===0&&s.worldEvents[0].content==='抵达驿站'&&r.warnings.length===1)});
 await test('被截断回复仍统计提供商报告的usage',async()=>{await reject(()=>a.call('story',[],config(),null,{},async()=>({ok:true,json:async()=>({choices:[{finish_reason:'length',message:{content:'partial'}}],usage:{prompt_tokens:21,completion_tokens:9}})})));const l=a.logs.at(-1);assert(!l.success&&l.inputTokens===21&&l.outputTokens===9)});
 await test('提供商负数用量按未知处理',async()=>{await a.call('story',[],config(),null,{},async()=>({ok:true,json:async()=>({choices:[{message:{content:'ok'}}],usage:{prompt_tokens:-1,completion_tokens:-2}})}));const l=a.logs.at(-1);assert(l.inputTokens===null&&l.outputTokens===null)});
 await test('JSON BOM和标准文本保持原值',()=>assert(a.parseAIResponse('\uFEFF {"story":"引号\\\"与括号 }","n":0}').n===0));
 await test('围栏前后说明文字',()=>assert(a.parseJSON('以下为结果：\n```json\n{"story":"正常"}\n```\n以上。').story==='正常'));
 await test('说明文字包裹嵌套JSON',()=>assert(a.parseJSON('结果如下 {"x":{"y":[1,2]},"story":"{文本}"} 完毕').x.y[1]===2));
 await test('修复字符串内真实换行和制表符',()=>assert(a.parseJSON('{"story":"第一行\n第二行\t结束"}').story==='第一行\n第二行\t结束'));
 await test('修复对象数组尾逗号且不改变正文',()=>assert(a.parseJSON('{"story":",}","list":[1,2,],}').story===',}'));
 await test('拒绝多个不同根对象',async()=>reject(()=>a.parseJSON('说明 {"a":1} 和 {"a":2}')));
 await test('拒绝截断根对象而不提取内部状态',async()=>reject(()=>a.parseJSON('{"player":{"a":1},"story":"断流')));
 await test('拒绝根数组且不提取其子对象',async()=>reject(()=>a.parseJSON('结果 [{"a":1}]')));
 await test('拒绝嵌套危险键',async()=>reject(()=>a.parseJSON('结果 {"x":{"__proto__":{"polluted":true}}}')));
 await test('拒绝JS执行表达式',async()=>reject(()=>a.parseJSON('{"a": alert(1)}')));
 await test('普通文本中的键名引用不误判',()=>assert(a.parseJSON(JSON.stringify({story:'"constructor": 只是正文'})).story.includes('constructor')));
 await test('单模型兼容响应完成提交且只调用一次',async()=>{const s=save(),c=config();c.mode='single';let count=0;const raw=[];const info=await a.run(s,c,null,async()=>{},async()=>{count++;return '结果\n```json\n'+JSON.stringify({...state(),...narrative})+'\n```'},async r=>raw.push(r));const next=j.apply(s,info.result);assert(count===1&&raw.length===1&&s.turn===0&&next.turn===1)});
 await test('纯文本回复只整理一次并保留原文',async()=>{const s=save(),c=config();c.mode='single';let count=0;const raw=[];const info=await a.run(s,c,null,async()=>{},async()=>++count===1?narrative.story:JSON.stringify({...state(),...narrative}),async r=>raw.push(r));assert(count===2&&raw[0].text===narrative.story&&info.result.story===narrative.story)});
 await test('整理失败不提交状态且保留两次响应',async()=>{const s=save(),c=config();c.mode='single';let count=0;const raw=[];await reject(()=>a.run(s,c,null,async()=>{},async()=>{count++;return '非JSON正文'},async r=>raw.push(r)));assert(count===2&&raw.length===2&&s.turn===0&&s.events.length===0)});
 await test('重试复用已保存原文不重写场景',async()=>{const s=save(),c=config();c.mode='single';s.pending.rawNarrative={text:narrative.story};let count=0;const info=await a.run(s,c,null,async()=>{},async(role,msg)=>{count++;assert(msg.at(-1).content.includes(narrative.story));return JSON.stringify({...state(),...narrative})});assert(count===1&&info.result.story===narrative.story)});
 await test('单模型正文有效但缺状态时独立结算',async()=>{const s=save(),c=config();c.mode='single';let count=0,draft;const info=await a.run(s,c,null,async d=>draft=d,async()=>JSON.stringify(++count===1?narrative:state()));assert(count===2&&draft.story===narrative.story&&info.result.summary===state().summary)});
 await test('原文保存失败停止后续模型调用',async()=>{let count=0;await reject(()=>a.run(save(),config(),null,async()=>{},async()=>{count++;return JSON.stringify(narrative)},async()=>{throw Error('storage full')}));assert(count===1)});
 await test('截断文本保留但不整理不结算',async()=>{const c=config();c.mode='single';let count=0,raw;await reject(()=>a.run(save(),c,null,async()=>{},async()=>{count++;throw Object.assign(Error('length'),{rawResponse:'partial',truncated:true})},async r=>raw=r));assert(count===1&&raw.truncated&&raw.text==='partial')});
 await test('content文本块兼容',async()=>assert(await a.call('story',[],config(),null,{},async()=>({ok:true,json:async()=>({choices:[{message:{content:[{type:'text',text:'一'},{type:'text',text:'二'}]}}]})}))==='一二'));
 await test('原文脱敏不截断正文',()=>{const c=config();c.roles.story.apiKey='secret-test';const r=a.redact('secret-test'+'中'.repeat(1000),c);assert(!r.includes('secret-test')&&r.length>1000)});
 document.getElementById('result').textContent=out.join('\n')+'\n\n'+out.filter(x=>x.startsWith('PASS')).length+'/'+out.length+' 通过';
};
</script>
