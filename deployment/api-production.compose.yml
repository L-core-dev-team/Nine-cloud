# Backend only. Pages build/deployment belongs to the independent frontend task.
services:
  migrate:
    image: ${API_IMAGE:?Set the immutable tested API image digest}
    command: ["pnpm", "--filter", "@jiuxiao/db", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set private production PostgreSQL URL}
    restart: "no"
  api:
    image: ${API_IMAGE:?Set the immutable tested API image digest}
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8787
      DATABASE_URL: ${DATABASE_URL:?Set private production PostgreSQL URL}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SUPABASE_AUTH_ENABLED: ${SUPABASE_AUTH_ENABLED:-false}
      SUPABASE_AUTH_EMAIL_ENABLED: ${SUPABASE_AUTH_EMAIL_ENABLED:-false}
      SUPABASE_AUTH_PHONE_ENABLED: ${SUPABASE_AUTH_PHONE_ENABLED:-false}
      SUPABASE_URL: ${SUPABASE_URL:-https://deyzirwnzjxsmyvfrsdb.supabase.co}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      AUTH_IDENTITY_HMAC_SECRET: ${AUTH_IDENTITY_HMAC_SECRET:-}
      AUTH_TRUSTED_PROXY_ADDRESSES: ${AUTH_TRUSTED_PROXY_ADDRESSES:-}
      SUPABASE_PHONE_HOOK_CONFIGURED: ${SUPABASE_PHONE_HOOK_CONFIGURED:-false}
      SUPABASE_PHONE_CAPTCHA_CONFIGURED: ${SUPABASE_PHONE_CAPTCHA_CONFIGURED:-false}
      SMS_ESTIMATED_SEGMENT_COST_CENTS: ${SMS_ESTIMATED_SEGMENT_COST_CENTS:-0}
      SMS_MAX_SEGMENTS_PER_SEND: ${SMS_MAX_SEGMENTS_PER_SEND:-0}
      SMS_MONTHLY_BUDGET_CENTS: ${SMS_MONTHLY_BUDGET_CENTS:-0}
      SMS_MONTHLY_MAX_SEGMENTS: ${SMS_MONTHLY_MAX_SEGMENTS:-0}
      SMS_DAILY_MAX_SEGMENTS: ${SMS_DAILY_MAX_SEGMENTS:-0}
      SMS_PHONE_HOURLY_LIMIT: ${SMS_PHONE_HOURLY_LIMIT:-0}
      SMS_PHONE_DAILY_LIMIT: ${SMS_PHONE_DAILY_LIMIT:-0}
      SMS_IP_HOURLY_LIMIT: ${SMS_IP_HOURLY_LIMIT:-0}
      SMS_IP_DAILY_LIMIT: ${SMS_IP_DAILY_LIMIT:-0}
      SMS_OWNER_HOURLY_LIMIT: ${SMS_OWNER_HOURLY_LIMIT:-0}
      SMS_OWNER_DAILY_LIMIT: ${SMS_OWNER_DAILY_LIMIT:-0}
      SMS_ALLOWED_COUNTRY_PREFIXES: ${SMS_ALLOWED_COUNTRY_PREFIXES:-}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:-login@example.invalid}
      SMTP_URL: ${SMTP_URL:-smtp://127.0.0.1:1025}
      AUTH_MAIL_PREFLIGHT: ${AUTH_MAIL_PREFLIGHT:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Strict}
      AUTH_PRIVACY_POLICY_URL: ${AUTH_PRIVACY_POLICY_URL:-}
      AUTH_PRIVACY_POLICY_VERSION: ${AUTH_PRIVACY_POLICY_VERSION:-}
      ACCOUNT_DATA_POLICY_PATH: ${ACCOUNT_DATA_POLICY_PATH:-}
      ACCOUNT_DATA_POLICY_VERSION: ${ACCOUNT_DATA_POLICY_VERSION:-}
      ACCOUNT_DELETE_ENABLED: ${ACCOUNT_DELETE_ENABLED:-false}
      TURN_RULES_MODULE: ${TURN_RULES_MODULE:-}
      NARRATIVE_CONFIG_PATH: ${NARRATIVE_CONFIG_PATH:-}
      NARRATIVE_OUTPUT_BUDGET: ${NARRATIVE_OUTPUT_BUDGET:-32768}
    # Optional host-owned reviewed rules/config/keys, mounted read-only; never web assets.
    env_file: ["./api.private.env"]
    volumes: ["./runtime:/run/jiuxiao:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
